<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cateo · Plataforma</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#101B33">
<meta name="robots" content="noindex">
<meta name="description" content="Plataforma Cateo: informes bilingües de concesiones mineras y directorio de oportunidades de exploración. Un servicio de Limly LLC.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
 --lapis:#101B33;--cobre:#D4622B;--malaquita:#178F6B;--oro:#F2B544;--caliche:#F6F2EB;
 --ink:#101B33;--page:#F6F2EB;--surface:#FFFFFF;--muted:#5D6473;--line:#DDD6C8;
 --brand:#101B33;--brand-ink:#FFFFFF;--brand-soft:#ECE4D6;--accent:#D4622B;--accent-ink:#101B33;
 --success:#2C7F62;--success-soft:#E1F0EA;--warning:#8C6410;--warning-soft:#F5ECD6;--danger:#B23A2E;--danger-soft:#F5E1DD;--info:#2F5D8A;--info-soft:#E2EAF4;
 --night:#101B33;--night-2:#1A2A4A;--night-ink:#F3EFE7;--night-muted:#B9C0CE;--contour:rgba(216,178,106,.38);
 --focus:#D4622B;--r-sm:6px;--r-md:12px;--r-lg:20px;
 --font-display:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
 --font-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
 color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --ink:#EEEAE2;--page:#10151F;--surface:#18202E;--muted:#A4ABB8;--line:#2C3546;--brand:#EEEAE2;--brand-ink:#10151F;--brand-soft:#1F293A;--accent:#E07A4E;--accent-ink:#10151F;
 --success:#4DB892;--success-soft:#15302A;--warning:#E3C384;--warning-soft:#352C15;--danger:#E2735E;--danger-soft:#3A1F1C;--info:#7FA9D6;--info-soft:#172538;--night:#0C111B;--night-2:#141C2A;--focus:#E07A4E;color-scheme:dark}}
:root[data-theme="dark"]{
 --ink:#EEEAE2;--page:#10151F;--surface:#18202E;--muted:#A4ABB8;--line:#2C3546;--brand:#EEEAE2;--brand-ink:#10151F;--brand-soft:#1F293A;--accent:#E07A4E;--accent-ink:#10151F;
 --success:#4DB892;--success-soft:#15302A;--warning:#E3C384;--warning-soft:#352C15;--danger:#E2735E;--danger-soft:#3A1F1C;--info:#7FA9D6;--info-soft:#172538;--night:#0C111B;--night-2:#141C2A;--focus:#E07A4E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}
h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;letter-spacing:-.035em}
.code,.kpi .n,.price{font-variant-numeric:tabular-nums}
.code{font-family:"IBM Plex Mono",ui-monospace,monospace}
.kpi .n,.price,.facts b{font-weight:800;letter-spacing:-.04em}
.btn{border-radius:999px}
h1{font-size:clamp(34px,5vw,48px);line-height:1.05}
h2{font-size:30px;line-height:1.15}
h3{font-size:22px;line-height:1.25}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted)}
.small{font-size:14px}.xs{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-md);border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-p:hover{filter:brightness(1.06)}
.btn-d{background:var(--brand);color:var(--brand-ink)}
.btn-g{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-g:hover{background:var(--brand-soft)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px}
.btn-lg{min-height:52px;padding:0 24px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
textarea.input{min-height:90px;resize:vertical}
.help{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.panel.flat{border-radius:var(--r-md)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{background:var(--success-soft);color:var(--success)}
.b-warn{background:var(--warning-soft);color:var(--warning)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-plain{background:var(--brand-soft);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);color:var(--night-ink);padding:12px 18px;border-radius:var(--r-md);font-size:14px;z-index:90;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* auth */
.auth{display:grid;grid-template-columns:minmax(300px,440px) 1fr;min-height:100%}
.auth-side{background:var(--night);color:var(--night-ink);padding:36px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:22px}
.auth-side .contours{opacity:.9}
.auth-side>*{position:relative}
.auth-main{padding:28px clamp(18px,5vw,64px);display:flex;flex-direction:column;gap:22px;max-width:760px;width:100%}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth-side{padding:24px}.auth-side .hide-m{display:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-size:14px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:620px){.roles{grid-template-columns:1fr}}
.role{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.role[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.role b{font-size:15px}
.steps{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.steps span{padding:2px 8px;border-radius:999px;background:var(--brand-soft)}
.steps span.on{background:var(--brand);color:var(--brand-ink)}
/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--night);color:var(--night-ink);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh}
.side a.nav{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-md);text-decoration:none;color:var(--night-muted);font-size:15px}
.side a.nav:hover{color:var(--night-ink);background:rgba(255,255,255,.05)}
.side a.nav[aria-current="page"]{background:rgba(216,178,106,.14);color:var(--night-ink)}
.side .who{margin-top:auto;font-size:13px;color:var(--night-muted);border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:14px clamp(16px,3vw,32px);border-bottom:1px solid var(--line);background:var(--page);position:sticky;top:0;z-index:20}
.content{padding:24px clamp(16px,3vw,32px) 96px;max-width:1120px}
.tabbar{display:none}
.mlogo{display:none}
@media(max-width:900px){.mlogo{display:inline-flex}}
#app{min-height:100%}
.auth{min-height:100vh;min-height:100dvh}
.contours{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media(max-width:900px){
 .shell{grid-template-columns:1fr}.side{display:none}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--night);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;justify-content:space-around}
 .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--night-muted);text-decoration:none;padding:6px 8px;border-radius:var(--r-md);min-width:64px}
 .tabbar a[aria-current="page"]{color:var(--night-ink);background:rgba(216,178,106,.14)}
}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.kpi .n{font-family:var(--font-display);font-size:36px;line-height:1}
.kpi .l{font-size:13px;color:var(--muted);margin-top:6px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.li{display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.li:first-child{border-top:0}
a.li:hover{background:var(--brand-soft)}
.li .t{font-weight:600}
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.opp:hover{border-color:var(--muted)}
.opp .map{aspect-ratio:16/9;background:var(--night)}
.opp .b{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.opp h3{font-size:22px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.facts div{background:var(--surface);padding:10px 12px}
.facts b{display:block;font-family:var(--font-display);font-size:22px;font-weight:400;line-height:1.1}
.facts span{font-size:12px;color:var(--muted)}
.mapbox{background:var(--night);border-radius:var(--r-lg);overflow:hidden;position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.layers{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:var(--night-2)}
.layers button{background:transparent;border:1px solid rgba(243,239,231,.25);color:var(--night-muted);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.layers button[aria-pressed="true"]{background:rgba(216,178,106,.2);color:var(--night-ink);border-color:var(--oro)}
.locked{position:relative;border:1px dashed var(--line);border-radius:var(--r-md);padding:14px;color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.plan{border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.plan[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.price{font-family:var(--font-display);font-size:40px;line-height:1}
.price s{font-size:20px;color:var(--muted)}
.plan ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.track div{font-size:12px;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}
.track div.done{border-color:var(--success);color:var(--ink)}
.track div.now{border-color:var(--accent);color:var(--ink);font-weight:600}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.report header{background:var(--night);color:var(--night-ink);padding:26px;position:relative;overflow:hidden}
.report header>*{position:relative}
.report section{padding:20px 26px;border-top:1px solid var(--line);display:grid;grid-template-columns:200px 1fr;gap:18px}
.report section h3{font-size:20px}
@media(max-width:720px){.report section{grid-template-columns:1fr;padding:18px}}
.ai-tag{font-size:12px;color:var(--info);background:var(--info-soft);padding:2px 8px;border-radius:999px;display:inline-block}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll-x{overflow-x:auto}
.empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.callout{border-radius:var(--r-md);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.callout.info{background:var(--info-soft);color:var(--ink)}
.callout.warn{background:var(--warning-soft);color:var(--ink)}
.callout.ok{background:var(--success-soft);color:var(--ink)}
.pill-filters{display:flex;gap:8px;flex-wrap:wrap}
.pill-filters select{min-height:38px;border-radius:999px;padding:0 12px;border:1px solid var(--line);background:var(--surface)}
.legal-mini{font-size:12px;color:var(--night-muted)}
.legal-mini a{color:inherit}
.code{font-variant-numeric:tabular-nums;letter-spacing:.02em}
@media print{.side,.top,.tabbar,.demo-bar,.no-print{display:none!important}.shell{display:block}.content{padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.top{gap:6px}.top .seg button,.auth-main .seg button{padding:8px 9px;font-size:13px}.top .btn-sm{padding-left:9px;padding-right:9px}}
[hidden]{display:none!important}
</style>
</head>

<script>
/* ===== Configuración: se edita en /config.js (no aquí) ===== */
var CC=window.CATEO_CONFIG||{};
function lc(x){return String(x||'').trim().toLowerCase()}
var CONFIG={
  landingUrl:CC.siteUrl!==undefined?CC.siteUrl:'/',
  pay:Object.assign({informe:'',vitrina:'',portafolio:'',screening:''},CC.polar||{}),
  contactEmail:CC.contactEmail||'manyosa@limly.io',
  whatsapp:String(CC.whatsapp||'').replace(/\D/g,''),
  calUrl:CC.calUrl||'',

  if(!kp&&CONFIG.teamEmails.indexOf(lm)>=0)kp={name:lm.split('@')[0],email:lm,role:'titular',ref:uid(),onboarded:true};
  if(!kp){AUTH.prefill=lm;AUTH.err=t('no_account');go('crear-'+AUTH.role);return}
  DB.user=kp;DB.known[lm]=kp;save();go('');render();return}
 if(a==='forgot'){var fm=lc(val('l-mail')),fe=document.getElementById('a-err');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(fm)){fe.textContent=t('err_mail');return}FBX.auth.sendPasswordResetEmail(fm).then(function(){toast(t('reset_sent'))},function(e){fe.textContent=FBX.msg(e)});return}
 if(a==='approve'){if(!isTeam()||!FBX.on)return;FBX.db.collection('vitrina').doc(b.dataset.id).update({st:'ok',checkedAt:Date.now()}).then(function(){TEAM.loaded=false;render()},function(){toast(t('net_err'))});return}
 if(a==='enter'){DB.user.onboarded=true;if(DB.known&&DB.user.email)DB.known[DB.user.email]=DB.user;save();go(navItems()[0][0]);render();return}
 if(a==='logout'){if(FBX.on){FBX.flush();FBX.auth.signOut();DB=blank();try{localStorage.removeItem(KEY)}catch(x){}}else{DB.user=null;save()}AUTH.sent=null;go('ingresar');render();return}
 if(a==='add-conc'){var code=val('c-code').replace(/\D/g,''),name=val('c-name'),reg=val('c-region'),ha=parseInt(val('c-ha'),10),er=document.getElementById('c-err');
  if(!code||!name||!reg||!ha){er.textContent=t('err_cform');return}if(code.length<8||code.length>12){er.textContent=t('err_code');return}
  var c={id:uid(),code:code,name:name,region:reg,country:val('c-country'),ha:ha,metal:val('c-metal'),status:val('c-status'),goal:val('c-goal'),vig:val('c-vig'),price:val('c-price'),notes:val('c-notes'),at:Date.now(),interest:0};DB.concs.push(c);save();go('ficha-'+c.id);return}
 if(a==='checkout'){var p=DB.plan||'vitrina';var pressed=document.querySelector('[data-plan][aria-pressed="true"]');if(pressed)p=pressed.dataset.plan;DB.checkout={cid:b.dataset.cid||null,plan:p};save();go('pago');return}
 if(a==='request-pay'){var rk=document.getElementById('p-ok');if(rk&&!rk.checked){toast(t('pay_terms'));rk.focus();return}var mt='mailto:'+CONFIG.contactEmail+'?subject='+encodeURIComponent(t('mail_subj')+': '+t('p_'+DB.checkout.plan))+'&body='+encodeURIComponent(orderText());finishOrder('pendiente');toast(t('order_req_ok'));var ma=document.createElement('a');ma.href=mt;ma.style.display='none';document.body.appendChild(ma);ma.click();ma.remove();return}
 if(a==='paylink'){DB.checkout.started=Date.now();save();return}
 if(a==='upsell'){DB.checkout={cid:b.dataset.cid,plan:'vitrina',upsell:true};save();go('pago');return}
 if(a==='paid'){var pk=document.getElementById('p-ok');if(pk&&!pk.checked){toast(t('pay_terms'));pk.focus();return}finishOrder('verificando');toast(t('paid_back'));return}
 if(a==='advance'||a==='mark-paid'){if(!isTeam())return;var patch=function(od){if(a==='advance')od.stage=Math.min(3,(od.stage||0)+1);else od.pay='pagado';return od};
  if(FBX.on){var to=TEAM.orders.filter(function(x){return x.id===b.dataset.id})[0];if(to){patch(to);FBX.db.collection('pedidos').doc(to.id).update({stage:to.stage,pay:to.pay||'pagado',updatedAt:Date.now()}).then(render,function(){toast(t('net_err'))})}return}
  var od=DB.orders.filter(function(x){return x.id===b.dataset.id})[0];if(od){patch(od);save();render()}return}
 if(a==='publish'){var pc=findConc(b.dataset.id);pc.published=true;pc.st='warn';save();FBX.publish(pc);toast(t('published'));render();return}
 if(a==='print'){try{window.print()}catch(x){toast(t('print'))}return}
 if(a==='unlock'){if(DB.unlocked.indexOf(b.dataset.id)<0&&DB.unlocked.length<3)DB.unlocked.push(b.dataset.id);save();render();return}
 if(a==='interest'){if(!document.getElementById('nda').checked){toast(t('nda'));return}var it={id:uid()+uid(),oid:b.dataset.id,at:Date.now(),who:DB.user.name+' <'+DB.user.email+'>'};DB.ints.push(it);FBX.add('intereses',it);if(!FBX.on){var oo=findOpp(b.dataset.id);var im=document.createElement('a');im.href='mailto:'+CONFIG.contactEmail+'?subject='+encodeURIComponent(t('interest')+': '+(oo?oo.name:b.dataset.id))+'&body='+encodeURIComponent(it.who);im.style.display='none';document.body.appendChild(im);im.click();im.remove()}var mc=findConc(b.dataset.id);if(mc){mc.interest=(mc.interest||0)+1;mc.st='info'}save();render();return}
 if(a==='copy-ref'){var rl=document.getElementById('ref-link');rl.select();try{navigator.clipboard.writeText(rl.value).then(function(){toast(t('copied'))},function(){document.execCommand('copy');toast(t('copied'))})}catch(x){document.execCommand('copy');toast(t('copied'))}return}
 if(a==='export'){var s=JSON.stringify(DB,null,2);try{navigator.clipboard.writeText(s).then(function(){toast(t('copied'))},function(){toast('—')})}catch(x){toast('—')}return}
 if(a==='delete'){if(confirm(t('del_q'))){var finish=function(){try{localStorage.removeItem(KEY)}catch(x){}DB=blank();go('crear-titular');render()};if(FBX.on&&FBX.user){FBX.removeAccount().then(finish,finish)}else{if(DB.user)delete DB.known[DB.user.email];var kn=DB.known;finish();DB.known=kn;save()}}return}
});
document.addEventListener('change',function(e){var el=e.target;
 if(el.id==='f-metal'){FIL.metal=el.value;render()}else if(el.id==='f-country'){FIL.country=el.value;render()}else if(el.id==='f-goal'){FIL.goal=el.value;render()}
 else if(el.dataset&&el.dataset.ck){var p=el.dataset.ck.split('|');var arr=DB.ops[p[0]]=DB.ops[p[0]]||[];var i=arr.indexOf(p[1]);if(el.checked&&i<0)arr.push(p[1]);if(!el.checked&&i>=0)arr.splice(i,1);save();var s=el.closest('details').querySelector('summary');s.textContent=t('ops_check')+' ('+arr.length+'/8)'}});
/* ===== Nube opcional (Firebase, plan gratuito Spark) =====
   Si /config.js trae firebase.apiKey, projectId y authDomain, la plataforma usa
   cuentas reales (correo + contraseña o Google) y guarda los datos en Firestore.
   Si no, funciona igual con las cuentas guardadas en el dispositivo. */
var BOOTED=false;
function clean(o){return JSON.parse(JSON.stringify(o))}
var FBX={on:false,user:null,auth:null,db:null,_t:null,
 enabled:function(){var f=CONFIG.firebase||{};return !!(f.apiKey&&f.projectId&&f.authDomain)},
 load:function(src){return new Promise(function(res,rej){var el=document.createElement('script');el.src=src;el.onload=res;el.onerror=rej;document.head.appendChild(el)})},
 init:function(){var base='https://www.gstatic.com/firebasejs/10.12.2/';
  return FBX.load(base+'firebase-app-compat.js').then(function(){return Promise.all([FBX.load(base+'firebase-auth-compat.js'),FBX.load(base+'firebase-firestore-compat.js')])})
  .then(function(){firebase.initializeApp(CONFIG.firebase);FBX.auth=firebase.auth();FBX.db=firebase.firestore();FBX.on=true;return true})
  .catch(function(){FBX.on=false;return false})},
 msg:function(e){var c=(e&&e.code)||'';if(c==='auth/email-already-in-use')return t('err_exists');if(c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-credential'||c==='auth/invalid-login-credentials')return t('err_auth');if(c==='auth/weak-password')return t('err_pass');if(c==='auth/invalid-email')return t('err_mail');if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return '';return t('net_err')},
 google:function(){var p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});return FBX.auth.signInWithPopup(p)},
 push:function(){if(!FBX.on||!FBX.user||!DB.user)return;clearTimeout(FBX._t);FBX._t=setTimeout(FBX.flush,700)},
 flush:function(){if(!FBX.on||!FBX.user||!DB.user)return Promise.resolve();clearTimeout(FBX._t);
  var d={profile:DB.user,concs:DB.concs,orders:DB.orders,ints:DB.ints,scr:DB.scr,unlocked:DB.unlocked,ops:DB.ops,lang:DB.lang,theme:DB.theme,updatedAt:Date.now()};
  return FBX.db.collection('cuentas').doc(FBX.user.uid).set(clean(d)).catch(function(){})},
 order:function(o){if(!FBX.on||!FBX.user)return;var d=Object.assign({},o,{uid:FBX.user.uid,email:DB.user.email,name:DB.user.name,phone:DB.user.phone||'',referredBy:DB.user.referredBy||''});
  FBX.db.collection('pedidos').doc(o.id).set(clean(d),{merge:true}).catch(function(){})},
 add:function(col,x){if(!FBX.on||!FBX.user)return;FBX.db.collection(col).doc(x.id).set(clean(Object.assign({},x,{uid:FBX.user.uid,email:DB.user.email}))).catch(function(){})},
 publish:function(c){if(!FBX.on||!FBX.user)return;var n=c.notes||'';
  FBX.db.collection('vitrina').doc(c.id).set(clean({id:c.id,uid:FBX.user.uid,name:c.name,code:c.code,country:c.country,region:c.region,ha:c.ha,metal:c.metal,goal:c.goal,st:'warn',sum:[n,n,n,n],at:Date.now()})).catch(function(){})},
 removeAccount:function(){var u=FBX.user,db=FBX.db;var pubs=DB.concs.filter(function(c){return c.published});
  return Promise.all(pubs.map(function(c){return db.collection('vitrina').doc(c.id).delete().catch(function(){})}))
  .then(function(){return db.collection('cuentas').doc(u.uid).delete()})
  .then(function(){return u.delete().catch(function(){return FBX.auth.signOut()})})}
};
var VIT={list:[],loaded:false,loading:false,load:function(){if(VIT.loading||!FBX.on)return;VIT.loading=true;
 Promise.all(['ok','info'].map(function(st){return FBX.db.collection('vitrina').where('st','==',st).limit(200).get()})).then(function(r){var docs=r[0].docs.concat(r[1].docs);VIT.list=docs.map(function(d){var x=d.data();x.real=true;if(!x.sum)x.sum=['','','',''];return x});VIT.loaded=true;VIT.loading=false;if(/^(directorio|oportunidad-)/.test(route()))render()})
 .catch(function(){VIT.loaded=true;VIT.loading=false})}};
var TEAM={orders:[],ints:[],vit:[],loaded:false,loading:false,load:function(){if(TEAM.loading||!FBX.on)return;TEAM.loading=true;var db=FBX.db;
 Promise.all([db.collection('pedidos').orderBy('at','desc').limit(300).get(),db.collection('intereses').orderBy('at','desc').limit(300).get(),db.collection('vitrina').where('st','==','warn').limit(200).get()])
 .then(function(r){TEAM.orders=r[0].docs.map(function(d){return d.data()});TEAM.ints=r[1].docs.map(function(d){return d.data()});TEAM.vit=r[2].docs.map(function(d){return d.data()});TEAM.loaded=true;TEAM.loading=false;render()})
 .catch(function(){TEAM.loaded=true;TEAM.loading=false;toast(t('net_err'));render()})}};

function finishOrder(pay){var co=DB.checkout;if(!co){go('pedidos');return}
 if(co.upsell){var ex=orderFor(co.cid);if(ex){ex.plan='vitrina';ex.amount=(ex.amount||0)+100;if(ex.pay==='pagado')ex.pay=pay;FBX.order(ex)}DB.checkout=null;save();go('informe-'+co.cid);return}
 var c=co.cid?findConc(co.cid):null;
 var o={id:uid()+uid(),cid:co.cid||null,plan:co.plan,amount:PRICES[co.plan].now,stage:0,pay:pay,at:Date.now(),eta:addDays(co.plan==='screening'?5:3),client:DB.user.name+' <'+DB.user.email+'>',concName:c?c.name:'',concCode:c?c.code:'',concRegion:c?c.region:'',lang:DB.lang};
 DB.orders.push(o);DB.checkout=null;DB.plan=null;save();FBX.order(o);go(co.cid?'ficha-'+co.cid:'pedidos')}

function afterLogin(u){FBX.user=u;var db=FBX.db;
 return db.collection('cuentas').doc(u.uid).get().then(function(doc){var d=doc.exists?doc.data():null;
  if(d&&d.profile){DB.user=d.profile;['concs','orders','ints','scr','unlocked'].forEach(function(k){DB[k]=d[k]||[]});DB.ops=d.ops||{};if(d.lang&&LANGS.indexOf(d.lang)>=0)DB.lang=d.lang;AUTH.needProfile=false}
  else{['concs','orders','ints','scr','unlocked'].forEach(function(k){DB[k]=[]});DB.ops={};
   var p=AUTH.pendingProf;
   if(p){p.email=lc(u.email);if(!p.name)p.name=u.displayName||p.email.split('@')[0];DB.user=p;AUTH.needProfile=false}
   else{DB.user=null;AUTH.needProfile=true;AUTH.mode='create';AUTH.prefill=lc(u.email);AUTH.prefName=u.displayName||''}}
  AUTH.pendingProf=null;
  if(!DB.user)return;
  save();FBX.flush();
  return db.collection('pedidos').where('uid','==',u.uid).get().then(function(q){q.docs.forEach(function(x){var r=x.data();var o=DB.orders.filter(function(y){return y.id===r.id})[0];if(o){o.stage=r.stage;o.pay=r.pay;o.plan=r.plan}});
   return db.collection('vitrina').where('uid','==',u.uid).get()}).then(function(q){q.docs.forEach(function(x){var r=x.data(),c=findConc(r.id);if(c)c.st=r.st});save()}).catch(function(){})})}

function boot(){
 function fin(){AUTH.busy=false;BOOTED=true;render()}
 if(!FBX.enabled()){fin();return}
 AUTH.busy=true;BOOTED=true;render();
 FBX.init().then(function(ok){if(!ok){fin();return}
  FBX.auth.onAuthStateChanged(function(u){
   if(u){AUTH.busy=true;render();afterLogin(u).then(fin,function(){toast(t('net_err'));fin()})}
   else{FBX.user=null;DB.user=null;AUTH.needProfile=false;fin()}})})}
boot();

</script>
